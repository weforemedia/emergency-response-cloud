# render.yaml - Blueprint for one-click Render deployment
# See: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: emergency-response-system
    runtime: python
    plan: starter  # Persistent disk requires at least "starter" plan ($7/mo)
    buildCommand: pip install -r requirements.txt && python -c "import reportlab; print('reportlab OK:', reportlab.Version)" && python database_setup.py
    startCommand: gunicorn app_cloud:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false  # You'll set this manually in Render dashboard
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
    disk:
      name: emergency-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
