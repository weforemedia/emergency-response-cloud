<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Emergency Response System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin-top: 20px;
        }

        h1 {
            color: #20c997;
            text-align: center;
            margin-bottom: 30px;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            flex: 1;
            min-width: 200px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card h2 {
            font-size: 3rem;
            margin: 0;
            color: #20c997;
        }

        .stat-card p {
            margin: 5px 0 0;
            opacity: 0.8;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #20c997;
        }

        #heatmap {
            height: 400px;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .nav-link-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }

        .nav-link-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .btn-report {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-report:hover {
            transform: scale(1.05);
        }

        .row {
            margin-bottom: 20px;
        }

        /* ========== MOBILE RESPONSIVE ========== */
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
                margin-top: 10px;
            }
            h1 {
                font-size: 1.4rem;
                margin-bottom: 15px;
            }
            .stats-row {
                gap: 8px;
            }
            .stat-card {
                min-width: 80px;
                padding: 15px 10px;
            }
            .stat-card h2 {
                font-size: 2rem;
            }
            .stat-card p {
                font-size: 0.75rem;
            }
            .chart-container {
                padding: 12px;
            }
            #heatmap {
                height: 250px;
            }
            .row > .col-md-6 {
                margin-bottom: 15px;
            }
            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            .nav-link-btn, .btn-report {
                width: 100%;
                text-align: center;
                padding: 10px 18px;
            }
        }

        @media (max-width: 400px) {
            .stats-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
            #heatmap {
                height: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📈 Analytics Dashboard</h1>

        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="/command_center" class="nav-link-btn">← Command Center</a>
            <a href="/accident_history" class="nav-link-btn">📊 History</a>
            <a href="/control_room" class="nav-link-btn">🎛️ Control Room</a>
            <button onclick="window.open('/api/generate_report')" class="btn-report">📄 Download PDF</button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-row">
            <div class="stat-card">
                <h2 id="totalAccidents">0</h2>
                <p>Total Accidents</p>
            </div>
            <div class="stat-card">
                <h2 id="avgResponseTime">--</h2>
                <p>Avg Response Time</p>
            </div>
            <div class="stat-card">
                <h2 id="completedRate">0%</h2>
                <p>Completion Rate</p>
            </div>
            <div class="stat-card">
                <h2 id="activeCameras">0</h2>
                <p>Active Cameras</p>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row">
            <div class="col-md-6">
                <div class="chart-container">
                    <div class="chart-title">📊 Accidents by Hour</div>
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-container">
                    <div class="chart-title">📷 Accidents by Camera</div>
                    <canvas id="cameraChart"></canvas>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="chart-container">
                    <div class="chart-title">📋 Status Distribution</div>
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-container">
                    <div class="chart-title">🗺️ Accident Heatmap</div>
                    <div id="heatmap"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script>
        let hourlyChart, cameraChart, statusChart;
        let heatmapLayer;

        // Initialize map for heatmap
        const map = L.map('heatmap').setView([18.5204, 73.8567], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        async function loadAnalytics() {
            try {
                const response = await fetch('/api/analytics_data');
                const data = await response.json();

                updateStats(data);
                updateHourlyChart(data.hourly);
                updateCameraChart(data.by_camera);
                updateStatusChart(data.by_status);
                updateHeatmap(data.heatmap);

            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        function updateStats(data) {
            document.getElementById('totalAccidents').textContent = data.total_accidents || 0;

            if (data.avg_response_time) {
                document.getElementById('avgResponseTime').textContent = Math.round(data.avg_response_time) + 's';
            } else {
                document.getElementById('avgResponseTime').textContent = 'N/A';
            }

            // Calculate completion rate
            const completed = data.by_status?.find(s => s.status === 'completed')?.count || 0;
            const total = data.total_accidents || 1;
            const rate = Math.round((completed / total) * 100);
            document.getElementById('completedRate').textContent = rate + '%';

            // Count unique cameras
            document.getElementById('activeCameras').textContent = data.by_camera?.length || 0;
        }

        function updateHourlyChart(hourlyData) {
            const ctx = document.getElementById('hourlyChart').getContext('2d');

            // Prepare data for all 24 hours
            const hours = Array.from({ length: 24 }, (_, i) => i.toString().padStart(2, '0'));
            const counts = hours.map(h => {
                const found = hourlyData?.find(d => d.hour === h);
                return found ? found.count : 0;
            });

            if (hourlyChart) hourlyChart.destroy();

            hourlyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: 'Accidents',
                        data: counts,
                        backgroundColor: 'rgba(32, 201, 151, 0.8)',
                        borderColor: 'rgba(32, 201, 151, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        },
                        x: {
                            ticks: { color: '#fff' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function updateCameraChart(cameraData) {
            const ctx = document.getElementById('cameraChart').getContext('2d');

            if (cameraChart) cameraChart.destroy();

            const labels = cameraData?.map(d => d.camera || 'Unknown') || ['No Data'];
            const counts = cameraData?.map(d => d.count) || [0];

            cameraChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: [
                            'rgba(32, 201, 151, 0.8)',
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(255, 193, 7, 0.8)',
                            'rgba(220, 53, 69, 0.8)',
                            'rgba(23, 162, 184, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#fff' }
                        }
                    }
                }
            });
        }

        function updateStatusChart(statusData) {
            const ctx = document.getElementById('statusChart').getContext('2d');

            if (statusChart) statusChart.destroy();

            const statusColors = {
                'pending': 'rgba(108, 117, 125, 0.8)',
                'dispatched': 'rgba(255, 193, 7, 0.8)',
                'completed': 'rgba(40, 167, 69, 0.8)',
                'cancelled': 'rgba(220, 53, 69, 0.8)'
            };

            const labels = statusData?.map(d => d.status || 'Unknown') || ['No Data'];
            const counts = statusData?.map(d => d.count) || [0];
            const colors = labels.map(l => statusColors[l] || 'rgba(128,128,128,0.8)');

            statusChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: colors
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: '#fff' }
                        }
                    }
                }
            });
        }

        function updateHeatmap(heatmapData) {
            if (heatmapLayer) {
                map.removeLayer(heatmapLayer);
            }

            if (heatmapData && heatmapData.length > 0) {
                // Add intensity for heatmap
                const points = heatmapData.map(p => [p[0], p[1], 0.5]);
                heatmapLayer = L.heatLayer(points, {
                    radius: 25,
                    blur: 15,
                    maxZoom: 17,
                    gradient: { 0.4: 'blue', 0.6: 'cyan', 0.7: 'lime', 0.8: 'yellow', 1: 'red' }
                }).addTo(map);

                // Also add markers for each accident
                heatmapData.forEach(p => {
                    L.circleMarker([p[0], p[1]], {
                        radius: 8,
                        fillColor: '#dc3545',
                        color: '#fff',
                        weight: 2,
                        fillOpacity: 0.8
                    }).addTo(map).bindPopup(`Accident at ${p[0].toFixed(4)}, ${p[1].toFixed(4)}`);
                });

                // Fit bounds to show all points
                if (heatmapData.length > 0) {
                    const bounds = L.latLngBounds(heatmapData.map(p => [p[0], p[1]]));
                    map.fitBounds(bounds.pad(0.1));
                }
            }
        }

        // Load data on page load
        loadAnalytics();

        // Auto-refresh every 60 seconds
        setInterval(loadAnalytics, 60000);
    </script>
</body>

</html>
