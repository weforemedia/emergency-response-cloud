<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Accident</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
            color: #0d6efd;
        }
        #map {
            height: 400px;
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .btn-report {
            background-color: #dc3545;
            border: none;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .btn-report:hover {
            background-color: #b02a37;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
            }
            .btn-report {
                font-size: 16px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <div class="container text-center mt-4">
        <h1>Report an Accident</h1>
        <p class="lead">Click the button below to report an accident and share your location.</p>
    </div>

    <!-- Button Container -->
    <div class="btn-container">
        <button id="reportAccidentBtn" class="btn-report">Report Accident</button>
    </div>

    <!-- Map Section -->
    <div class="container mt-4">
        <div id="map"></div>
    </div>

    <!-- Footer Section -->
    <footer class="text-center mt-4 mb-4">
        <p class="text-muted small">© 2025 Emergency Response System. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        const map = L.map('map').setView([18.5204, 73.8567], 12); // Default Pune Station location
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let accidentMarker = null;

        document.getElementById('reportAccidentBtn').addEventListener('click', async () => {
            // Get user's current location
            navigator.geolocation.getCurrentPosition(async (position) => {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // Remove previous marker if it exists
                if (accidentMarker) {
                    map.removeLayer(accidentMarker);
                }

                // Add a red marker for the accident location
                accidentMarker = L.marker([latitude, longitude], {
                    icon: L.icon({
                        iconUrl: 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34]
                    })
                }).addTo(map);

                // Bind a popup with the label "Accident Location"
                accidentMarker.bindPopup("Accident Location").openPopup();

                // Center the map on the accident location
                map.setView([latitude, longitude], 12);
                console.log(`Accident Location: Latitude=${latitude}, Longitude=${longitude}`);

                try {
                    // Report accident via AJAX to /report_accident
                    const response = await fetch('/report_accident', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ latitude, longitude })
                    });
                    const result = await response.json();
                    console.log("Accident Reported:", result);

                    // Send accident location to Command Center via AJAX
                    fetch('/command_center', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ latitude, longitude })
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log("Command Center Response:", data);
                    })
                    .catch(error => {
                        console.error("Error communicating with Command Center:", error);
                    });

                    alert("Accident reported successfully!");

                } catch (error) {
                    console.error("Error reporting accident:", error);
                    alert("An error occurred while reporting the accident.");
                }
            }, (error) => {
                alert("Error getting location: " + error.message);
            });
        });
    </script>
</body>
</html>
